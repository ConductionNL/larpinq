version: 2

# This repo had no dependabot.yml at all — Dependabot was not configured for
# any ecosystem. Scoped narrowly here to what the fleet-wide composer
# cooldown rollout needs: a composer entry meeting the floor new gate 93
# (composer-cooldown-config) enforces. Adding npm/github-actions coverage
# for this repo is a separate decision, not folded in here.
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 2
      include:
        - "*"
      exclude:
        - "conduction/*"
