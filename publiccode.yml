description:
  en:
    shortDescription: >
      Live action role-playing (LARP) event and character management for Nextcloud.
    longDescription: >
      Larpinq provides comprehensive management tools for live action role-playing
      (LARP) communities and events. It supports character creation and management,
      event organisation, player registration, skill and item tracking, and community
      administration. Built on Nextcloud and Open Register, it offers a collaborative
      platform for LARP groups of all sizes.
      Install it from the Nextcloud App Store: https://apps.nextcloud.com/apps/larpinq.
      Conduction maintains this component at its own cost, committed until 31 December 2027.
    features:
      - Settings (worlds and campaigns) that scope characters, events and rules
      - Character sheets with background stories and a game master approval workflow
      - Players linked to Nextcloud contacts
      - Abilities, skills, items, conditions and effects with a stat calculation engine
      - Events with a participant roster and Nextcloud Calendar scheduling
      - Post-event XP awards with an audit trail and prerequisite checks
      - Printable PDF character sheets and per-event cast lists
      - Access limited to an enrolled Nextcloud group
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-characters.png
      - img/screenshot-events.png

  nl:
    shortDescription: >
      Live action role-playing (LARP) evenement- en karakterbeheer voor Nextcloud.
    longDescription: >
      Larpinq biedt uitgebreide beheertools voor live action role-playing (LARP)
      gemeenschappen en evenementen. Het ondersteunt het aanmaken en beheren van
      karakters, evenementorganisatie, spelersregistratie, vaardigheids- en
      itembeheer, en gemeenschapsadministratie. Gebouwd op Nextcloud en Open Register
      biedt het een collaboratief platform voor LARP-groepen van elke omvang.
      Installeer het via de Nextcloud App Store: https://apps.nextcloud.com/apps/larpinq.
      Conduction onderhoudt dit component voor eigen rekening, toegezegd tot 31 december 2027.
    features:
      - Settings (werelden en campagnes) die karakters, events en regels afbakenen
      - Karakterbladen met achtergrondverhaal en goedkeuring door de spelleider
      - Spelers gekoppeld aan Nextcloud-contacten
      - Abilities, skills, items, conditions en effects met een stat-berekeningsmotor
      - Events met een deelnemerslijst en planning via Nextcloud Agenda
      - XP-toekenningen na een event met audit trail en controle op vereisten
      - Afdrukbare PDF-karakterbladen en castlijsten per event
      - Toegang beperkt tot een aangemelde Nextcloud-groep
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-characters.png
      - img/screenshot-events.png

